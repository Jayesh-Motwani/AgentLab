<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$title</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            color: #1f2937;
        }

        .email-container {
            max-width: 640px;
            margin: 32px auto;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }

        .header {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            padding: 24px 32px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.3;
        }

        .content {
            padding: 28px 32px 32px;
            line-height: 1.7;
            font-size: 16px;
        }

        .content p {
            margin: 0 0 16px;
        }

        .footer {
            padding: 0 32px 28px;
            color: #6b7280;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="email-container">
        <div class="header">
            <h1>$title</h1>
        </div>
        <div class="content">
            $content
        </div>
        <div class="footer">
            Sent from Research Agent.
        </div>
    </div>
</body>

</html>
